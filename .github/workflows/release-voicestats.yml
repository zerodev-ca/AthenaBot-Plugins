name: Release VoiceStats

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version Tag (e.g. 1.0.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout voicestats branch
        uses: actions/checkout@v7
        with:
          ref: voicestats

      - name: Build ZIP
        run: |
          mkdir -p staging/voicestats
          cp -r main.js src data staging/voicestats
          cd staging
          zip -r ../voicestats.zip voicestats/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: voicestats
          path: voicestats.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: voicestats-${{ github.event.inputs.version_tag }}
          name: "VoiceStats - ${{ github.event.inputs.version_tag }}"
          body: |
            ## Description
            Download the plugin below!
            - `voicestats.zip`
          files: |
            voicestats.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
