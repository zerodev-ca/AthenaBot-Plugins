name: Release VoiceStats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout voicestats branch
        uses: actions/checkout@v7
        with:
          ref: voicestats

      - name: Read version from main.js
        id: ver
        run: |
          v=$(grep -oE "version:[[:space:]]*'[^']*'" main.js | head -1 | sed -E "s/.*'([^']*)'.*/\1/")
          if [ -z "$v" ]; then echo "::error::No version field found in main.js"; exit 1; fi
          echo "::notice::Releasing voicestats $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        run: |
          mkdir -p staging/voicestats
          cp -r main.js src data staging/voicestats
          cd staging
          zip -r ../voicestats.zip voicestats/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: voicestats
          path: voicestats.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: voicestats-${{ needs.build.outputs.version }}
          name: "VoiceStats - ${{ needs.build.outputs.version }}"
          body: |
            ## Description
            Download the plugin below!
            - `voicestats.zip`
          files: |
            voicestats.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
