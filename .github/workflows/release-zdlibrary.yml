name: Release ZDLibrary

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version Tag (e.g. 1.0.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zdlibrary branch
        uses: actions/checkout@v7
        with:
          ref: zdlibrary

      - name: Build ZIP
        run: |
          mkdir -p staging/zdlibrary
          cp -r main.js src data staging/zdlibrary
          cd staging
          zip -r ../zdlibrary.zip zdlibrary/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zdlibrary
          path: zdlibrary.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: zdlibrary-${{ github.event.inputs.version_tag }}
          name: "ZDLibrary - ${{ github.event.inputs.version_tag }}"
          body: |
            ## Description
            Download the plugin below!
            - `zdlibrary.zip`
          files: |
            zdlibrary.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
