name: Release ZDLibrary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout zdlibrary branch
        uses: actions/checkout@v7
        with:
          ref: zdlibrary

      - name: Read version from main.js
        id: ver
        run: |
          v=$(grep -oE "version:[[:space:]]*'[^']*'" main.js | head -1 | sed -E "s/.*'([^']*)'.*/\1/")
          if [ -z "$v" ]; then echo "::error::No version field found in main.js"; exit 1; fi
          echo "::notice::Releasing zdlibrary $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        run: |
          mkdir -p staging/zdlibrary
          cp -r main.js src data staging/zdlibrary
          cd staging
          zip -r ../zdlibrary.zip zdlibrary/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zdlibrary
          path: zdlibrary.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: zdlibrary-${{ needs.build.outputs.version }}
          name: "ZDLibrary - ${{ needs.build.outputs.version }}"
          body: |
            ## Description
            Download the plugin below!
            - `zdlibrary.zip`
          files: |
            zdlibrary.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
