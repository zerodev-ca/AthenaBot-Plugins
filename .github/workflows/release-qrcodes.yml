name: Release QRCodes

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version Tag (e.g. 1.0.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout qrcodes branch
        uses: actions/checkout@v7
        with:
          ref: qrcodes

      - name: Build ZIP
        run: |
          mkdir -p staging/qrcodes
          cp -r main.js src data staging/qrcodes
          cd staging
          zip -r ../qrcodes.zip qrcodes/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrcodes
          path: qrcodes.zip

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: qrcodes-${{ github.event.inputs.version_tag }}
          name: "QRCodes - ${{ github.event.inputs.version_tag }}"
          body: |
            ## Description
            Download the plugin below!
            - `qrcodes.zip`
          files: |
            qrcodes.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
